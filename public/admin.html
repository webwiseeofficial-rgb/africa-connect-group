<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Administration — Africa Connect Group</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/assets/admin.css?v=1">
</head>
<body>
<div id="setup" class="center" hidden>
 <div class="card narrow"><h1>Configuration requise</h1>
 <p>Renseignez <code>SUPABASE_URL</code> et <code>SUPABASE_ANON_KEY</code> dans <code>assets/config.js</code>, puis rechargez cette page.</p></div>
</div>

<div id="login" class="center" hidden>
 <form class="card narrow" id="loginForm" autocomplete="on">
  <img src="/assets/logo-wide.png" alt="Africa Connect Group" class="login-logo">
  <h1>Espace administrateur</h1>
  <p class="muted">Connectez-vous pour gérer le site.</p>
  <label>Adresse e-mail<input type="email" name="email" autocomplete="username" required></label>
  <label>Mot de passe<input type="password" name="password" autocomplete="current-password" required></label>
  <p class="err" id="loginErr" role="alert" hidden></p>
  <button class="btn primary block" type="submit">Se connecter</button>
 </form>
</div>

<div id="app" class="shell" hidden>
 <aside class="side">
  <div class="brand"><img src="/assets/logo-wide.png" alt="Africa Connect Group"><span>Administration</span></div>
  <nav id="tabs">
   <button data-tab="stats" class="on"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Visiteurs</button>
   <button data-tab="news"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Actualités</button>
   <button data-tab="project"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>Projets</button>
   <button data-tab="contact"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>Coordonnées</button>
  </nav>
  <div class="side-foot">
   <a href="/" target="_blank" rel="noopener">Voir le site ↗</a>
   <span id="who" class="muted"></span>
   <button id="logout" class="link">Se déconnecter</button>
  </div>
 </aside>
 <main class="main">
  <section id="v-stats" class="view"></section>
  <section id="v-news" class="view" hidden></section>
  <section id="v-project" class="view" hidden></section>
  <section id="v-contact" class="view" hidden></section>
 </main>
</div>

<div id="modal" class="modal" hidden><div class="modal-box" role="dialog" aria-modal="true" id="modalBox"></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="/assets/config.js"></script>
<script src="/assets/admin.js?v=1"></script>
</body>
</html>
